# API de formamx: checkout con Stripe, webhook de pagos y cola de pedidos.
# Secretos (nunca aquí): wrangler secret put STRIPE_SECRET_KEY | STRIPE_WEBHOOK_SECRET | NTFY_TOPIC
name = "formamx-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "formamx"
database_id = "98dbf2ef-7777-4e1e-85d5-02b3734148b4"

[vars]
SITE_ORIGIN = "https://formamx.com"
