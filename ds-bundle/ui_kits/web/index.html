<!-- @dsCard group="Web" viewport="1280x780" subtitle="Home de la bitácora — filtro funcional" name="Web · Bitácora" -->
<!-- @startingPoint section="Web" subtitle="Home de la bitácora de forma" viewport="1280x780" -->
<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<title>forma — bitácora</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../components/forma-loader.js"></script>
</head>
<body><div id="root"></div>
<script type="text/plain" id="app-src">
const NS = window.Forma || {};
const { Button, Tag, Input, ProjectCard, Meta, tagTone } = NS;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "portada": "editorial",
  "ambiente": "noche",
  "bitacora": "galería"
}/*EDITMODE-END*/;

const PROYECTOS = [
  { id: 1, cat: 'madera', image: '../../assets/imagenes/silla-jardin-01.jpeg', meta: ['Proyecto 001', '2026.04', 'Pino'], title: 'Silla de jardín', note: 'La primera capa quedó chueca. La segunda, mejor.', tags: ['madera', 'exterior'], unique: true },
  { id: 2, cat: 'impresión 3d', image: null, placeholder: 'foto pendiente', meta: ['Proyecto 002', 'En proceso', 'PLA'], title: 'Lámpara impresa', note: 'Tercer intento del difusor. Los dos primeros se doblaron.', tags: ['impresión 3d', 'luz'] },
  { id: 3, cat: 'video', image: null, placeholder: 'grabando', meta: ['Proyecto 003', 'Pronto'], title: 'Video: el jardín en junio', note: 'Grabando las tardes. Sin guion, con pájaros.', tags: ['video', 'naturaleza'] },
];
const CATS = ['todos', 'madera', 'impresión 3d', 'video'];

function DiarioRow({ p, dark }) {
  const [hover, setHover] = React.useState(false);
  return (
    <article onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} style={{
      display: 'flex', gap: 24, alignItems: 'center', background: dark ? 'var(--tinta)' : 'var(--surface-card)',
      borderRadius: 'var(--radius-m)', padding: 16, cursor: 'pointer',
      border: dark ? '1px solid ' + (hover ? '#43433D' : '#33332F') : '1px solid transparent',
      boxShadow: dark ? 'none' : (hover ? 'var(--shadow-raised)' : 'var(--shadow-card)'),
      transition: 'box-shadow var(--duration-slow) var(--ease-out)',
    }}>
      {p.image
        ? <img src={p.image} alt={p.title} style={{ width: 168, height: 112, objectFit: 'cover', borderRadius: 'var(--radius-s)', flexShrink: 0 }} />
        : <div style={{ width: 168, height: 112, borderRadius: 'var(--radius-s)', background: dark ? '#242421' : 'var(--hueso)', border: dark ? '1px solid #33332F' : 'none', boxSizing: 'border-box', display: 'grid', placeItems: 'center', flexShrink: 0 }}>
            <span style={{ fontFamily: 'var(--font-meta)', fontWeight: 700, fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: dark ? 'var(--gris)' : 'var(--text-faint)' }}>{p.placeholder}</span>
          </div>}
      <div style={{ flex: 1, minWidth: 0 }}>
        <Meta items={p.meta} tone={dark ? 'noche' : 'azul'} />
        <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 'var(--display-sm)', lineHeight: 'var(--leading-display)', marginTop: 6, color: dark ? 'var(--blanco)' : 'var(--text-body)' }}>{p.title}</div>
        <div style={{ fontSize: 'var(--text-sm)', lineHeight: 'var(--leading-body)', color: dark ? 'var(--gris-claro)' : 'var(--text-muted)', marginTop: 4 }}>{p.note}</div>
      </div>
      <div style={{ display: 'flex', gap: 8, flexShrink: 0 }}>
        {p.unique && <Tag tone={dark ? 'blanco' : 'tinta'}>pieza única</Tag>}
        {p.tags.map((t, i) => <Tag key={i} tone={tagTone(t) + (dark ? '-noche' : '')}>{t}</Tag>)}
      </div>
    </article>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [cat, setCat] = React.useState('todos');
  const visibles = PROYECTOS.filter(p => cat === 'todos' || p.cat === cat);
  const noche = t.ambiente === 'noche';
  const C = {
    page: noche ? 'var(--tinta)' : 'var(--surface-page)',
    text: noche ? 'var(--blanco)' : 'var(--text-body)',
    muted: noche ? 'var(--gris-claro)' : 'var(--text-muted)',
    logo: noche ? '../../assets/logo/forma-blanco.svg' : '../../assets/logo/forma-negro.svg',
  };
  return (
    <div style={{ background: C.page, minHeight: '100vh', transition: 'background var(--duration-slow) var(--ease-out)' }}>
      <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 24, padding: '20px 48px', maxWidth: 1100, margin: '0 auto', boxSizing: 'border-box' }}>
        <img src={C.logo} style={{ height: 30 }} alt="forma" />
        <nav style={{ display: 'flex', gap: 28, alignItems: 'center' }}>
          <a href="#" style={{ color: C.text, textDecoration: 'none', fontSize: 15, fontWeight: 600 }}>Bitácora</a>
          <a href="#" style={{ color: C.muted, textDecoration: 'none', fontSize: 15 }}>Piezas</a>
          <a href="#" style={{ color: C.muted, textDecoration: 'none', fontSize: 15 }}>Quién</a>
          <Button variant="secondary" size="sm" style={noche ? { color: 'var(--blanco)', borderColor: 'rgba(255,255,255,0.28)' } : undefined}>Escríbeme</Button>
        </nav>
      </header>

      {t.portada === 'editorial' ? (
        <section style={{ maxWidth: 1100, margin: '0 auto', padding: '48px 48px 0', boxSizing: 'border-box', display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 48, alignItems: 'center' }}>
          <div>
            <Meta items={['Taller de proyectos', 'Desde 2026']} tone={noche ? 'noche' : 'azul'} />
            <h1 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 'var(--display-xl)', lineHeight: 'var(--leading-display)', letterSpacing: 'var(--tracking-display)', margin: '14px 0 0', color: C.text }}>Cada pieza se hace una vez.</h1>
            <p style={{ fontSize: 'var(--text-lg)', lineHeight: 'var(--leading-body)', color: C.muted, margin: '18px 0 0', maxWidth: 440 }}>Bancas, lámparas, videos, música. Lo que sale bien y lo que se quema, documentado. Se vende, si quieres — pero primero la historia.</p>
            <div style={{ display: 'flex', gap: 12, marginTop: 28 }}>
              <Button variant="primary" size="lg">Ver la bitácora</Button>
              <Button variant="ghost" size="lg" style={{ color: C.text }}>Quién soy →</Button>
            </div>
          </div>
          <img src="../../assets/imagenes/silla-jardin-01.jpeg" style={{ width: '100%', height: 380, objectFit: 'cover', borderRadius: 'var(--radius-l)' }} alt="silla de jardín al sol" />
        </section>
      ) : (
        <section style={{ position: 'relative', margin: '12px 24px 0', borderRadius: 'var(--radius-l)', overflow: 'hidden' }}>
          <img src="../../assets/imagenes/silla-jardin-01.jpeg" style={{ width: '100%', height: 520, objectFit: 'cover', display: 'block' }} alt="silla de jardín al sol" />
          <div style={{ position: 'absolute', left: 32, bottom: 32, background: 'var(--blanco)', borderRadius: 'var(--radius-m)', padding: '28px 32px', maxWidth: 480, boxShadow: 'var(--shadow-raised)' }}>
            <Meta items={['Taller de proyectos', 'Desde 2026']} />
            <h1 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 'var(--display-lg)', lineHeight: 'var(--leading-display)', letterSpacing: 'var(--tracking-display)', margin: '10px 0 0', color: 'var(--text-body)' }}>Cada pieza se hace una vez.</h1>
            <div style={{ display: 'flex', gap: 12, marginTop: 20 }}>
              <Button variant="primary">Ver la bitácora</Button>
              <Button variant="ghost">Quién soy →</Button>
            </div>
          </div>
        </section>
      )}

      <section style={{ maxWidth: 1100, margin: '0 auto', padding: '64px 48px', boxSizing: 'border-box' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap' }}>
          <h2 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 'var(--display-md)', margin: 0, color: C.text }}>Bitácora</h2>
          <div style={{ display: 'flex', gap: 8 }}>
            {CATS.map(c => (
              <button key={c} onClick={() => setCat(c)} style={{
                fontFamily: 'var(--font-body)', fontSize: 13, fontWeight: 600, cursor: 'pointer',
                padding: '6px 14px', borderRadius: 'var(--radius-pill)',
                border: '1.5px solid ' + (c === cat ? (noche ? 'var(--azul-noche)' : 'var(--azul)') : (noche ? 'rgba(255,255,255,0.22)' : 'var(--border-strong)')),
                background: c === cat ? (noche ? 'var(--azul-noche)' : 'var(--azul-claro)') : 'transparent',
                color: c === cat ? (noche ? 'var(--tinta)' : 'var(--azul-oscuro)') : C.muted,
              }}>{c}</button>
            ))}
          </div>
        </div>
        {t.bitacora === 'galería' ? (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 24, marginTop: 24 }}>
            {visibles.map(p => (
              <ProjectCard key={p.id} image={p.image} placeholder={p.placeholder} meta={p.meta} title={p.title} note={p.note} tags={p.tags} unique={p.unique} dark={noche} onClick={() => {}} />
            ))}
          </div>
        ) : (
          <div style={{ display: 'grid', gap: 16, marginTop: 24 }}>
            {visibles.map(p => <DiarioRow key={p.id} p={p} dark={noche} />)}
          </div>
        )}
      </section>

      <footer style={{ background: 'var(--surface-inverse)', padding: '56px 48px', borderTop: noche ? '1px solid rgba(255,255,255,0.14)' : 'none' }}>
        <div style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', justifyContent: 'space-between', gap: 48, alignItems: 'center', flexWrap: 'wrap' }}>
          <div>
            <img src="../../assets/logo/forma-blanco.svg" style={{ height: 26 }} alt="forma" />
            <p style={{ color: 'var(--gris-claro)', fontSize: 14, lineHeight: 1.6, margin: '14px 0 0', maxWidth: 340 }}>Sin algoritmo de por medio: te escribo cuando hay pieza nueva. Poco y de vez en cuando.</p>
          </div>
          <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end' }}>
            <div style={{ width: 260 }}><Input placeholder="tu@correo.com" /></div>
            <Button variant="primary">Avísame</Button>
          </div>
        </div>
      </footer>

      <TweaksPanel>
        <TweakSection label="Portada" />
        <TweakRadio label="Composición" value={t.portada} options={['editorial', 'a sangre']} onChange={(v) => setTweak('portada', v === 'a sangre' ? 'a sangre' : 'editorial')} />
        <TweakSection label="Ambiente" />
        <TweakRadio label="Página" value={t.ambiente} options={['día', 'noche']} onChange={(v) => setTweak('ambiente', v)} />
        <TweakSection label="Bitácora" />
        <TweakRadio label="Vista" value={t.bitacora} options={['galería', 'diario']} onChange={(v) => setTweak('bitacora', v)} />
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
(function () {
  function fetchText(url) {
    var r = new XMLHttpRequest();
    r.open('GET', url, false);
    r.send();
    return r.status >= 200 && r.status < 300 ? r.responseText : '';
  }
  var run = function (src) {
    (0, eval)(Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code);
  };
  run(fetchText('tweaks-panel.jsx'));
  run(document.getElementById('app-src').textContent);
})();
</script></body></html>
