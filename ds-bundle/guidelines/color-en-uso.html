<!-- @dsCard group="Colors" viewport="700x210" subtitle="Azul actúa, naranja es material, verde es afuera" name="Color en uso" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}</style></head>
<body><div style="display:flex;gap:14px;align-items:center;padding:20px 24px;flex-wrap:wrap">
<button style="font-family:var(--font-body);font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-contrast);border:none;border-radius:var(--radius-pill);padding:11px 24px">Ver proyecto</button>
<button style="font-family:var(--font-body);font-weight:700;font-size:14px;background:transparent;color:var(--text-body);border:1.5px solid var(--border-strong);border-radius:var(--radius-pill);padding:10px 24px">Escríbeme</button>
<span style="color:var(--accent);font-weight:700;font-size:14px">Leer la historia →</span>
<span style="background:var(--taller-soft);color:var(--taller-ink);font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--radius-pill)">madera</span>
<span style="background:var(--support-soft);color:var(--support);font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--radius-pill)">exterior</span>
<span style="background:var(--accent-soft);color:var(--azul-oscuro);font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--radius-pill)">impresión 3d</span>
<span style="background:var(--surface-inverse);color:var(--text-inverse);font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--radius-pill)">pieza única</span>
</div>
<div style="display:flex;gap:12px;padding:0 24px 20px">
<div style="flex:1;background:var(--azul);color:var(--blanco);border-radius:12px;padding:12px 16px;font-size:13px">Bloques de sección en azul…</div>
<div style="flex:1;background:var(--bosque);color:var(--blanco);border-radius:12px;padding:12px 16px;font-size:13px">…o verde bosque…</div>
<div style="flex:1;background:var(--tinta);color:var(--blanco);border-radius:12px;padding:12px 16px;font-size:13px">…o tinta. Sin gradientes.</div>
</div></body></html>
