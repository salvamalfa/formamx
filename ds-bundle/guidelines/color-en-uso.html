<!-- @dsCard group="Colors" viewport="700x170" subtitle="Roles: acción naranja, apoyo bosque, detalle mostaza" name="Color en uso" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}</style></head>
<body><div style="display:flex;gap:16px;align-items:center;padding:20px 24px;flex-wrap:wrap">
<button style="font-family:var(--font-body);font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-contrast);border:none;border-radius:var(--radius-pill);padding:11px 22px">Ver proyecto</button>
<button style="font-family:var(--font-body);font-weight:600;font-size:14px;background:transparent;color:var(--text-body);border:1.5px solid var(--border-strong);border-radius:var(--radius-pill);padding:10px 22px">Escríbeme</button>
<span style="background:var(--support-soft);color:var(--support);font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--radius-pill)">madera</span>
<span style="background:var(--highlight-soft);color:#8A6415;font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--radius-pill)">en proceso</span>
<span style="background:var(--surface-inverse);color:var(--text-inverse);font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--radius-pill)">pieza única</span>
</div>
<div style="display:flex;gap:12px;padding:0 24px 20px">
<div style="flex:1;background:var(--bosque);color:var(--crema);border-radius:12px;padding:12px 16px;font-size:13px">Bloques de sección en bosque…</div>
<div style="flex:1;background:var(--naranja);color:var(--blanco);border-radius:12px;padding:12px 16px;font-size:13px">…o naranja pleno. Sin gradientes.</div>
</div></body></html>
