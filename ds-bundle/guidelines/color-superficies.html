<!-- @dsCard group="Colors" viewport="700x140" subtitle="Superficies, bordes y tintas secundarias" name="Neutrales y superficies" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);color:var(--text-body)}</style></head>
<body><div style="display:flex;gap:10px;padding:14px">
<div style="flex:1"><div style="height:60px;border-radius:12px;background:var(--blanco);border:1px solid var(--border-soft)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-faint);margin-top:6px">--blanco tarjetas</div></div>
<div style="flex:1"><div style="height:60px;border-radius:12px;background:var(--crema-claro);border:1px solid var(--border-soft)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-faint);margin-top:6px">--crema-claro</div></div>
<div style="flex:1"><div style="height:60px;border-radius:12px;background:var(--crema-oscuro)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-faint);margin-top:6px">--surface-sunken</div></div>
<div style="flex:1"><div style="height:60px;border-radius:12px;background:var(--tinta-suave)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-faint);margin-top:6px">--text-muted</div></div>
<div style="flex:1"><div style="height:60px;border-radius:12px;background:var(--tinta-tenue)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-faint);margin-top:6px">--text-faint</div></div>
<div style="flex:1"><div style="height:60px;border-radius:12px;background:var(--blanco);border:2px solid var(--border-strong)"></div><div style="font-size:11px;font-family:var(--font-mono);color:var(--text-faint);margin-top:6px">--border-*</div></div>
</div></body></html>
