<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);color:var(--text-body)}</style></head>
<body><div style="display:flex;gap:9px;padding:14px">
<div style="flex:1"><div style="height:54px;border-radius:10px;background:var(--hueso);border:1px solid var(--borde)"></div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">HUESO</div></div>
<div style="flex:1"><div style="height:54px;border-radius:10px;background:var(--borde)"></div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">BORDE</div></div>
<div style="flex:1"><div style="height:54px;border-radius:10px;background:var(--gris)"></div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">GRIS</div></div>
<div style="flex:1"><div style="height:54px;border-radius:10px;background:var(--azul-claro)"></div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">AZUL CLARO</div></div>
<div style="flex:1"><div style="height:54px;border-radius:10px;background:var(--azul-noche)"></div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">AZUL NOCHE</div></div>
<div style="flex:1"><div style="height:54px;border-radius:10px;background:var(--naranja-claro)"></div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">NARANJA CL.</div></div>
<div style="flex:1"><div style="height:54px;border-radius:10px;background:var(--naranja-noche)"></div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">NARANJA N.</div></div>
<div style="flex:1"><div style="height:54px;border-radius:10px;background:var(--bosque-claro)"></div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">BOSQUE CL.</div></div>
<div style="flex:1"><div style="height:54px;border-radius:10px;background:var(--bosque-noche)"></div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">BOSQUE N.</div></div>
</div></body></html>
