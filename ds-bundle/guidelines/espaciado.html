<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}</style></head>
<body><div style="display:flex;gap:14px;align-items:flex-end;padding:20px 24px">
<div><div style="width:var(--space-1);height:var(--space-1);background:var(--azul);border-radius:2px"></div><div style="font-size:10px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">1·4</div></div>
<div><div style="width:var(--space-2);height:var(--space-2);background:var(--azul);border-radius:2px"></div><div style="font-size:10px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">2·8</div></div>
<div><div style="width:var(--space-3);height:var(--space-3);background:var(--azul);border-radius:3px"></div><div style="font-size:10px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">3·12</div></div>
<div><div style="width:var(--space-4);height:var(--space-4);background:var(--azul);border-radius:4px"></div><div style="font-size:10px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">4·16</div></div>
<div><div style="width:var(--space-5);height:var(--space-5);background:var(--naranja);border-radius:5px"></div><div style="font-size:10px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">5·24</div></div>
<div><div style="width:var(--space-6);height:var(--space-6);background:var(--naranja);border-radius:6px"></div><div style="font-size:10px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">6·32</div></div>
<div><div style="width:var(--space-7);height:var(--space-7);background:var(--bosque);border-radius:8px"></div><div style="font-size:10px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">7·48</div></div>
<div><div style="width:var(--space-8);height:var(--space-8);background:var(--bosque);border-radius:10px"></div><div style="font-size:10px;font-weight:700;letter-spacing:0.05em;color:var(--text-faint);margin-top:6px">8·64</div></div>
<div style="font-size:11px;color:var(--text-muted);max-width:170px;line-height:1.5;align-self:center">Entre secciones: 7–8. Dentro de tarjetas: 4–5.</div>
</div></body></html>
