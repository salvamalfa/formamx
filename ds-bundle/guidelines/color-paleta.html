<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);color:var(--text-body)}</style></head>
<body><div style="display:flex;gap:10px;padding:14px">
<div style="flex:1"><div style="height:74px;border-radius:12px;background:var(--blanco);border:1px solid var(--borde)"></div><div style="font-size:12px;font-weight:700;margin-top:6px">Blanco</div><div style="font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--text-faint)">#FFFFFF fondo</div></div>
<div style="flex:1"><div style="height:74px;border-radius:12px;background:var(--tinta)"></div><div style="font-size:12px;font-weight:700;margin-top:6px">Tinta</div><div style="font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--text-faint)">#1A1A18 texto</div></div>
<div style="flex:1.3"><div style="height:74px;border-radius:12px;background:var(--azul)"></div><div style="font-size:12px;font-weight:700;margin-top:6px">Azul taller</div><div style="font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--text-faint)">#2E6DA4 información</div></div>

<div style="flex:1.3"><div style="height:74px;border-radius:12px;background:var(--bosque)"></div><div style="font-size:12px;font-weight:700;margin-top:6px">Verde bosque</div><div style="font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--text-faint)">#3E5A40 afuera</div></div>
</div></body></html>
