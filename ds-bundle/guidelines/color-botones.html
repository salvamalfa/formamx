<!-- @dsCard group="Colors" viewport="700x150" subtitle="Naranja actúa, azul acompaña" name="Jerarquía de botones" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}.b{font-family:var(--font-body);font-weight:700;font-size:14px;border-radius:var(--radius-pill);padding:11px 22px;border:none;cursor:pointer}.l{font-size:10.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-faint);margin-top:8px}</style></head>
<body><div style="display:flex;gap:12px;padding:22px 24px;align-items:flex-start">
<div><button class="b" style="background:var(--action);color:var(--action-contrast)">Ver la bitácora</button><div class="l">primario · naranja</div></div>
<div><button class="b" style="background:var(--action-2);color:var(--action-2-contrast)">Escríbeme</button><div class="l">secundario · azul</div></div>
<div><button class="b" style="background:var(--blanco);color:var(--azul-oscuro);border:1.5px solid var(--azul)">Ver materiales</button><div class="l">terciario · contorno</div></div>
<div><button class="b" style="background:var(--support);color:var(--blanco)">Lo de afuera</button><div class="l">support · bosque</div></div>
<div><button class="b" style="background:transparent;color:var(--azul);padding-left:14px;padding-right:14px">Más →</button><div class="l">ghost</div></div>
</div></body></html>
