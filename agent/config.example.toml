# Configuración del agente de impresión de formamx.
# Copia este archivo como C:\Users\salva\Desktop\FORMA\06-Web\config.toml
# y llena tus valores.
# La copia real NUNCA se sube al repo (contiene el token del agente).

api_base = "https://formamx-api.formamx.workers.dev"
agent_token = "PEGA-AQUI-EL-AGENT-TOKEN"

# Cada cuántos segundos preguntar por trabajos nuevos.
poll_seconds = 20

# Carpeta con los 3MF rebanados (exportados de Bambu Studio), una pieza por
# archivo, un solo filamento, y EL MATERIAL EXPLÍCITO en el nombre:
#   <files_dir>\pantalla\tessera.petg.gcode.3mf   (uno por modelo y material)
#   <files_dir>\cuerpo\cuerpo.pla.gcode.3mf
#   <files_dir>\tapa\tapa.pla.gcode.3mf
files_dir = 'C:\Users\salva\Desktop\FORMA\06-Web\3mf'

# true = ensayo: simula la impresión sin tocar la impresora.
dry_run = true
dry_run_seconds = 20

log_file = 'C:\Users\salva\Desktop\FORMA\06-Web\agent.log'

[printer]
serial = "PEGA-AQUI-EL-NUMERO-DE-SERIE"
access_code = "PEGA-AQUI-EL-ACCESS-CODE"
# El agente encuentra la IP solo por SSDP (broadcast de la impresora en modo
# LAN), así que no hace falta ponerla ni actualizarla cuando la impresora
# cambia de IP al apagarse y encenderse. Descomenta `ip` solo si tu red
# bloquea el multicast (VLANs, algunos routers) y el agente no la encuentra:
# ahí sirve como respaldo manual, pero si la impresora cambia de IP tendrás
# que volver a editarla a mano, como antes.
# ip = "PEGA-AQUI-LA-IP-LOCAL"

# Rebanado de los STL que mandan los clientes (docs/STL_CLIENTES.md). Es
# OPCIONAL: sin esta sección el agente solo imprime. Los perfiles los genera
# una vez `python -m formamx_agent.flatten_profiles` (ver README).
# [slicer]
# exe = 'C:\Program Files\Bambu Studio\bambu-studio.exe'
# profiles_dir = 'C:\Users\salva\Desktop\FORMA\06-Web\perfiles'
# timeout_seconds = 900
