# Configuración del agente de impresión de formamx.
# Copia este archivo como C:\Users\salva\Desktop\FORMA\04-Web\formamx\config.toml
# y llena tus valores.
# La copia real NUNCA se sube al repo (contiene el token del agente).

api_base = "https://formamx-api.formamx.workers.dev"
agent_token = "PEGA-AQUI-EL-AGENT-TOKEN"

# Cada cuántos segundos preguntar por trabajos nuevos.
poll_seconds = 20

# Carpeta con los 3MF rebanados (exportados de Bambu Studio), una pieza por
# archivo, un solo filamento, y EL MATERIAL EXPLÍCITO en el nombre:
#   <files_dir>\pantalla\tessera.petg.gcode.3mf   (uno por modelo y material)
#   <files_dir>\cuerpo\cuerpo.pla.gcode.3mf
#   <files_dir>\tapa\tapa.pla.gcode.3mf
files_dir = 'C:\Users\salva\Desktop\FORMA\04-Web\formamx\3mf'

# true = ensayo: simula la impresión sin tocar la impresora.
dry_run = true
dry_run_seconds = 20

log_file = 'C:\Users\salva\Desktop\FORMA\04-Web\formamx\agent.log'

[printer]
ip = "PEGA-AQUI-LA-IP-LOCAL"
serial = "PEGA-AQUI-EL-NUMERO-DE-SERIE"
access_code = "PEGA-AQUI-EL-ACCESS-CODE"
